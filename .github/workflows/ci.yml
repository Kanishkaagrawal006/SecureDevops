name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test & Security Scans
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    defaults:
      run:
        working-directory: app

    steps:

      # --------------------------------
      # Checkout
      # --------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------
      # Java
      # --------------------------------
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # --------------------------------
      # Build & Test
      # --------------------------------
      - name: Build project
        run: mvn -B clean package -DskipTests

      - name: Run tests
        run: mvn -B test

      # --------------------------------
      # SonarCloud
      # --------------------------------
      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-cache

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar
          -Dsonar.token=$SONAR_TOKEN

      # --------------------------------
      # Semgrep SAST
      # --------------------------------
      - name: Set up Python (for Semgrep CLI)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST scan
        continue-on-error: true
        run: >
          semgrep scan
          --config p/ci
          --config p/java
          --config p/owasp-top-ten
          --sarif
          --output semgrep-results.sarif

      - name: Upload Semgrep SARIF (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: app/semgrep-results.sarif

      - name: Upload Semgrep results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/semgrep-results.sarif

      # --------------------------------
      # Semgrep Security Gate
      # --------------------------------
      - name: Semgrep Security Gate (fail on ERROR severity)
        run: >
          semgrep scan
          --config p/ci
          --config p/java
          --config p/owasp-top-ten
          --severity ERROR

      # --------------------------------
      # OWASP Dependency-Check
      # --------------------------------
      - name: OWASP Dependency-Check
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B org.owasp:dependency-check-maven:check

      - name: Upload OWASP Dependency-Check report (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-dependency-check-report
          path: |
            app/target/dependency-check-report.html
            app/target/dependency-check-report.json

      # --------------------------------
      # Upload test results
      # --------------------------------
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: app/target/surefire-reports/

      # --------------------------------
      # Upload JAR
      # --------------------------------
      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: catalog-jar
          path: app/target/*.jar

      # --------------------------------
      # Docker
      # --------------------------------
      - name: Build Docker image
        run: docker build -t catalog-app:${{ github.sha }} .

      # --------------------------------
      # Trivy Report
      # --------------------------------
      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: catalog-app:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Trivy SARIF (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # --------------------------------
      # Trivy Security Gate
      # --------------------------------
      - name: Trivy Security Gate (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: catalog-app:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: '1'