name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build, Test & SonarCloud
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # required to upload Semgrep results to the Security tab

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build project
        run: mvn -B clean package -DskipTests

      - name: Run tests
        run: mvn -B test

      - name: Cache SonarCloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: sonar-cache

      - name: SonarCloud Scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:4.0.0.4121:sonar
          -Dsonar.token=$SONAR_TOKEN

      - name: Set up Python (for Semgrep CLI)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep SAST scan
        # Report-only for now — a later phase turns critical findings into a hard pipeline gate
        continue-on-error: true
        run: >
          semgrep scan
          --config p/ci
          --config p/java
          --config p/owasp-top-ten
          --sarif --output semgrep-results.sarif

      - name: Upload Semgrep SARIF (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: app/semgrep-results.sarif

      - name: Upload Semgrep results to GitHub Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: app/semgrep-results.sarif

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: app/target/surefire-reports/

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: catalog-jar
          path: app/target/*.jar
            - name: OWASP Dependency-Check
              continue-on-error: true
              env:
                NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
              run: mvn -B org.owasp:dependency-check-maven:check

            - name: Upload OWASP Dependency-Check report (artifact)
              if: always()
              uses: actions/upload-artifact@v4
              with:
                name: owasp-dependency-check-report
                path: |
                  app/target/dependency-check-report.html
                  app/target/dependency-check-report.json

            - name: Upload OWASP results to GitHub Security tab
              if: always()
              uses: github/codeql-action/upload-sarif@v3
              with:
                sarif_file: app/target/dependency-check-report.sarif